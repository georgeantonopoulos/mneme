name: release

# Publishes a GitHub release (and its tag) for the version on main.
# Run it from the Actions tab or the API: workflow "release", input version, e.g. 1.1.0.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, as in pyproject.toml (e.g. 1.1.0)"
        required: true
      title:
        description: "Optional title after the version, e.g. The Cortex"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must look like 1.2.3"; exit 1; }
          grep -qx "version = \"$VERSION\"" pyproject.toml || { echo "pyproject.toml is not at $VERSION"; exit 1; }
          grep -q "^## \[$VERSION\]" CHANGELOG.md || { echo "CHANGELOG.md has no [$VERSION] section"; exit 1; }

      - name: Release notes from the changelog
        env:
          VERSION: ${{ inputs.version }}
        run: |
          awk -v head="## [$VERSION]" 'index($0, head) == 1 {on = 1; next} /^## \[/ {if (on) exit} on' CHANGELOG.md > notes.md
          test -s notes.md

      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          TITLE: ${{ inputs.title }}
        run: |
          name="Mneme v$VERSION"
          [ -n "$TITLE" ] && name="$name — $TITLE"
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "$name" --notes-file notes.md
