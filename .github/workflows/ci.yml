name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package
        run: python -m pip install -e '.[dev]'

      - name: Run tests
        run: python -m pytest -q

      - name: Run runtime tests with hostile Mneme env
        env:
          MNEME_DB: /tmp/hostile-ci-db.sqlite
          MNEME_VAULT: /tmp/hostile-ci-vault
          MNEME_OUT: /tmp/hostile-ci-out
        run: python -m pytest tests/test_runtime_and_packets.py tests/test_cli_contracts.py -q

      - name: Run skill drift checker
        run: python scripts/skill_drift_check.py

      - name: Run smoke test
        run: mneme run-once --vault ./examples/vault --db /tmp/mneme_smoke.sqlite --out /tmp/mneme_smoke_out

      - name: Run contract check
        run: mneme contract check --db /tmp/mneme_smoke.sqlite

      - name: Run privacy scan
        run: python scripts/privacy_scan.py
